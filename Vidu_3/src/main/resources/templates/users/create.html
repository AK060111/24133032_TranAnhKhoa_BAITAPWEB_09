<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Thêm User')}"></head><body><div th:replace="~{layouts/layout :: page(~{::main})}"><main><form class="form-card" th:object="${adminUserCreateDTO}" th:action="@{/users/create}" method="post"><h1>Thêm User</h1><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Username</label><input th:field="*{username}"><small class="error-text" th:errors="*{username}"></small><label>Email</label><input type="email" th:field="*{email}"><small class="error-text" th:errors="*{email}"></small><label>Họ tên</label><input th:field="*{fullName}"><small class="error-text" th:errors="*{fullName}"></small><label>Mật khẩu</label><input type="password" th:field="*{password}"><small class="error-text" th:errors="*{password}"></small><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}"><small class="error-text" th:errors="*{confirmPassword}"></small><label>Role</label><select th:field="*{roleName}"><option value="ROLE_USER">USER</option><option value="ROLE_ADMIN">ADMIN</option></select><label class="checkbox"><input type="checkbox" th:field="*{enabled}"> Enabled</label><button class="button">Lưu</button> <a class="button secondary" th:href="@{/users}">Hủy</a></form></main></div></body></html>
