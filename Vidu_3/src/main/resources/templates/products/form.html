<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head(${mode=='create'?'Thêm Product':'Sửa Product'})}"></head><body><div th:replace="~{layouts/layout :: page(~{::main})}"><main><form class="form-card" th:object="${productDTO}" th:action="${mode=='create'}?@{/products/create}:@{/products/edit/{id}(id=${productDTO.id})}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"><h1 th:text="${mode=='create'?'Thêm Product':'Sửa Product'}"></h1><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{id}"><label>Tên sản phẩm</label><input th:field="*{name}"><small class="error-text" th:errors="*{name}"></small><label>Mô tả</label><textarea th:field="*{description}" rows="5"></textarea><small class="error-text" th:errors="*{description}"></small><label>Giá</label><input type="number" min="0" step="0.01" th:field="*{price}"><small class="error-text" th:errors="*{price}"></small><label>Ảnh</label><input type="file" name="image" accept="image/*"><img th:if="${productDTO.imageUrl!=null}" th:src="${productDTO.imageUrl}" class="preview" alt="Ảnh hiện tại"><div><button class="button">Lưu</button> <a class="button secondary" th:href="@{/products}">Hủy</a></div></form></main></div></body></html>
