<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head><body><div class="auth-page"><div class="auth-card"><h1>Đặt lại mật khẩu</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email</label><input type="email" th:field="*{email}" required><small class="error-text" th:errors="*{email}"></small><label>OTP</label><input th:field="*{otp}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required><small class="error-text" th:errors="*{otp}"></small><label>Mật khẩu mới</label><input type="password" th:field="*{password}" required><small class="error-text" th:errors="*{password}"></small><label>Xác nhận mật khẩu</label><input type="password" th:field="*{confirmPassword}" required><small class="error-text" th:errors="*{confirmPassword}"></small><button class="button full">Đổi mật khẩu</button></form></div></div></body></html>
