<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head><body><div class="auth-page"><div class="auth-card"><h1>Xác nhận OTP</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert error"><p th:each="e:${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email</label><input type="email" th:field="*{email}" required><small class="error-text" th:errors="*{email}"></small><label>OTP 6 số</label><input th:field="*{otp}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required><small class="error-text" th:errors="*{otp}"></small><button class="button full">Xác nhận</button></form><form th:action="@{/resend-register-otp}" method="post" class="mt"><input type="hidden" name="email" th:value="${verifyOtpDTO.email}"><button class="button secondary full">Gửi lại OTP</button></form><p><a th:href="@{/login}">Quay lại đăng nhập</a></p></div></div></body></html>
