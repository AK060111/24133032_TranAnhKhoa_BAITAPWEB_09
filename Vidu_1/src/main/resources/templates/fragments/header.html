<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="header">
    <a class="brand" th:href="@{/}">IOTSTAR</a>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}">Quản trị</a>
    </nav>
    <div class="account" sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Đăng nhập</a>
    </div>
    <div class="account" sec:authorize="isAuthenticated()">
        <span>Xin chào, <strong sec:authentication="name">email@example.com</strong></span>
        <form class="inline" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>
</header>
</body>
</html>
