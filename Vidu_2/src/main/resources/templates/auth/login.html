<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - IOTSTAR</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <div class="auth-brand">IOTSTAR</div>
    <h1>Đăng nhập</h1>
    <p class="muted">Sử dụng username hoặc email của bạn.</p>

    <div class="alert error" role="alert" th:if="${param.error}">
        Username/email hoặc mật khẩu không đúng.
    </div>
    <div class="alert success" role="status" th:if="${param.logout}">
        Bạn đã đăng xuất.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="login">Username hoặc Email</label>
        <input id="login" type="text" name="login" placeholder="Username hoặc Email"
               required autofocus autocomplete="username">

        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" placeholder="Mật khẩu"
               required autocomplete="current-password">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="primary" type="submit">Đăng nhập</button>
    </form>
</main>
</body>
</html>
