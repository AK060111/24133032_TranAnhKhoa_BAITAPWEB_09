<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="header">
    <a class="brand" th:href="@{/}">IOTSTAR</a>
    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Quản trị</a>
    </nav>

    <div class="account" sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Đăng nhập</a>
    </div>

    <div class="account" sec:authorize="isAuthenticated()">
        <img class="avatar"
             th:if="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images)}"
             th:src="${#authentication.principal.images}"
             alt="Ảnh đại diện">
        <span class="avatar avatar-placeholder"
              th:if="${#authentication.principal.images == null or #strings.isEmpty(#authentication.principal.images)}"
              aria-label="Chưa có ảnh đại diện">👤</span>
        <span class="profile">
            <strong th:text="${#authentication.principal.fullName}">Họ tên</strong>
            <small th:text="${#authentication.principal.username + ' · ' + #authentication.principal.role}">username · USER</small>
        </span>
        <form class="inline" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>
</header>
</body>
</html>
